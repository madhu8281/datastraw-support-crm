<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raise a Ticket | DataStraw Support</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html" aria-label="DataStraw Support home">
        <span class="brand-mark" aria-hidden="true">DS</span>
        <span class="brand-text"><strong>DataStraw</strong><small>Support</small></span>
      </a>
      <nav class="site-nav">
        <a href="index.html">Dashboard</a>
        <a href="create-ticket.html" class="active">Raise ticket</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <a class="back-link" href="index.html">← Back to tickets</a>
    <div class="page-heading">
      <span class="eyebrow">CUSTOMER SUPPORT</span>
      <h1>Raise a support ticket</h1>
      <p class="page-intro">Tell us what happened. We’ll create a ticket ID so the support team can track your issue.</p>
    </div>

    <div id="error-box" class="alert alert-error hidden"></div>
    <div id="success-box" class="alert alert-success hidden"></div>

    <section class="card form-card">
      <!-- novalidate turns off the browser's own popups so our own error
           messages are the only ones the user sees (consistent wording). -->
      <form id="ticket-form" novalidate>
        <div class="field">
          <label for="customer_name">Your name <span class="required">*</span></label>
          <input type="text" id="customer_name" class="input" placeholder="Madhavi Lokhande" />
          <div class="field-error" id="error-customer_name"></div>
        </div>

        <div class="field">
          <label for="customer_email">Email address <span class="required">*</span></label>
          <input type="email" id="customer_email" class="input" placeholder="madhavi@example.com" />
          <div class="field-error" id="error-customer_email"></div>
        </div>

        <div class="field">
          <label for="subject">Issue / subject <span class="required">*</span></label>
          <input type="text" id="subject" class="input" placeholder="Unable to login" />
          <div class="field-error" id="error-subject"></div>
        </div>

        <div class="field">
          <label for="description">Describe the issue <span class="required">*</span></label>
          <textarea id="description" class="textarea" placeholder="What is the customer experiencing? Include any error message they saw."></textarea>
          <div class="field-error" id="error-description"></div>
        </div>

        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority" class="select">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
          <div class="help">Choose High only if the issue is blocking an important task or access.</div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Submit ticket</button>
          <a href="index.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/create-ticket.js"></script>
</body>
</html>
